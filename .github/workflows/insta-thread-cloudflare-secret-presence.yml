name: Insta Thread Cloudflare Secret Presence
on:
  push:
    branches: [ops/insta-thread-cloudflare-probe-20260910]
    paths: ['.github/workflows/insta-thread-cloudflare-secret-presence.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      A: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      B: ${{ secrets.CF_API_TOKEN }}
      C: ${{ secrets.CLOUDFLARE_TOKEN }}
      D: ${{ secrets.CF_TOKEN }}
      E: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
      F: ${{ secrets.CF_TUNNEL_TOKEN }}
      G: ${{ secrets.TUNNEL_TOKEN }}
      H: ${{ secrets.CLOUDFLARED_TOKEN }}
      I: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      J: ${{ secrets.CF_ACCOUNT_ID }}
      K: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      L: ${{ secrets.CF_ZONE_ID }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          r(){ [[ -n "$2" ]] && echo "$1=present" || echo "$1=absent"; }
          r CLOUDFLARE_API_TOKEN "${A:-}"; r CF_API_TOKEN "${B:-}"; r CLOUDFLARE_TOKEN "${C:-}"; r CF_TOKEN "${D:-}"
          r CLOUDFLARE_TUNNEL_TOKEN "${E:-}"; r CF_TUNNEL_TOKEN "${F:-}"; r TUNNEL_TOKEN "${G:-}"; r CLOUDFLARED_TOKEN "${H:-}"
          r CLOUDFLARE_ACCOUNT_ID "${I:-}"; r CF_ACCOUNT_ID "${J:-}"; r CLOUDFLARE_ZONE_ID "${K:-}"; r CF_ZONE_ID "${L:-}"
