name: deploy-wrapper-ci

on:
  pull_request:
    paths:
      - 'scripts/deploy-wholesalehub.ps1'
      - 'scripts/supplier-catalog-watchdog.sh'
      - 'wordpress/mu-plugins/wholesalehub-meta-policy.php'
      - 'wordpress/mu-plugins/wholesalehub-frontend-regressions.php'
      - 'wordpress/mu-plugins/wholesalehub-catalog-watchdog.php'
      - 'tests/wholesalehub-meta-policy.test.php'
      - 'tests/wholesalehub-frontend-regressions.test.php'
      - 'tests/wholesalehub-catalog-watchdog.test.php'
      - '.gitattributes'
      - '.github/workflows/deploy-wrapper-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-wholesalehub.ps1'
      - 'scripts/supplier-catalog-watchdog.sh'
      - 'wordpress/mu-plugins/wholesalehub-meta-policy.php'
      - 'wordpress/mu-plugins/wholesalehub-frontend-regressions.php'
      - 'wordpress/mu-plugins/wholesalehub-catalog-watchdog.php'
      - 'tests/wholesalehub-meta-policy.test.php'
      - 'tests/wholesalehub-frontend-regressions.test.php'
      - 'tests/wholesalehub-catalog-watchdog.test.php'
      - '.gitattributes'
      - '.github/workflows/deploy-wrapper-ci.yml'

jobs:
  meta-policy-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test WholesaleHub Meta policy
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/mu-plugins/wholesalehub-meta-policy.php
          php -l tests/wholesalehub-meta-policy.test.php
          php tests/wholesalehub-meta-policy.test.php

  frontend-regressions-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test WholesaleHub frontend regression guards
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/mu-plugins/wholesalehub-frontend-regressions.php
          php -l tests/wholesalehub-frontend-regressions.test.php
          php tests/wholesalehub-frontend-regressions.test.php

  catalog-watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint and test catalog watchdogs
        shell: bash
        run: |
          set -euo pipefail
          php -l wordpress/mu-plugins/wholesalehub-catalog-watchdog.php
          php -l tests/wholesalehub-catalog-watchdog.test.php
          php tests/wholesalehub-catalog-watchdog.test.php
          bash -n scripts/supplier-catalog-watchdog.sh
          tmp="$(mktemp -d)"
          cat > "$tmp/status.json" <<'JSON'
          {"status":"completed","last_success_at":"2026-08-28T05:00:00Z","last_failure_at":null,"started_at":"2026-08-28T04:50:00Z"}
          JSON
          WHOLESALEHUB_RUNTIME_DIR="$tmp" \
          WHOLESALEHUB_CATALOG_STATUS_FILE="$tmp/status.json" \
          WHOLESALEHUB_CATALOG_WATCHDOG_STATE_FILE="$tmp/state.txt" \
          WHOLESALEHUB_WATCHDOG_NOW_EPOCH=1787896800 \
          WHOLESALEHUB_RUN_HOUR=15 \
          WHOLESALEHUB_WATCHDOG_NO_TELEGRAM=1 \
          bash scripts/supplier-catalog-watchdog.sh | grep -q 'WHOLESALEHUB_CATALOG_WATCHDOG='

  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell wrapper
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\deploy-wholesalehub.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("PARSE_ERROR line={0} col={1} message={2} text={3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
            }
            exit 1
          }
          Write-Host 'POWERSHELL_PARSE_OK'
      - name: Verify generated remote Bash normalization primitive
        shell: powershell
        run: |
          $text = Get-Content '.\scripts\deploy-wholesalehub.ps1' -Raw
          if ($text -notmatch '\$remoteScript\s*=\s*\$remoteScript\.Replace\("`r`n",\s*"`n"\)\.Replace\("`r",\s*"`n"\)') {
            throw 'Required CRLF-to-LF normalization is missing from deploy wrapper.'
          }
          $sample = "#!/usr/bin/env bash`r`nset -Eeuo pipefail`r`necho ok`r`n"
          $sample = $sample.Replace("`r`n", "`n").Replace("`r", "`n")
          if ([System.Text.Encoding]::UTF8.GetBytes($sample) -contains 13) { throw 'CR byte remains after normalization.' }
          Write-Host 'WINDOWS_TO_UNIX_LF_OK'

  embedded-bash-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded remote Bash
        shell: pwsh
        run: |
          $text = Get-Content './scripts/deploy-wholesalehub.ps1' -Raw
          $startMarker = '$remoteScript = @'''
          $start = $text.IndexOf($startMarker)
          if ($start -lt 0) { throw 'Embedded remote Bash start marker not found' }
          $bodyStart = $text.IndexOf("`n", $start) + 1
          $end = $text.IndexOf("`n'@", $bodyStart)
          if ($bodyStart -le 0 -or $end -lt 0) { throw 'Embedded remote Bash end marker not found' }
          $bash = $text.Substring($bodyStart, $end - $bodyStart)
          $bash = $bash.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText('/tmp/remote-deploy.sh', $bash, [System.Text.UTF8Encoding]::new($false))
      - name: Parse embedded remote Bash
        shell: bash
        run: |
          set -euo pipefail
          ! LC_ALL=C grep -q $'\r' /tmp/remote-deploy.sh
          bash -n /tmp/remote-deploy.sh
          echo 'REMOTE_BASH_PARSE_OK'
      - name: Guard metadata-safe MU deployment
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'write_mu_contents() {' /tmp/remote-deploy.sh
          grep -Fq 'write_mu_contents "$RELEASE/wordpress/mu-plugins/$file" "$LIVE_MU/$file"' /tmp/remote-deploy.sh
          grep -Fq 'write_mu_contents "$BACKUP/mu/$file" "$LIVE_MU/$file"' /tmp/remote-deploy.sh
          ! grep -Fq 'cp -a "$RELEASE/wordpress/mu-plugins/$file" "$LIVE_MU/$file"' /tmp/remote-deploy.sh
          ! grep -Fq 'cp -a "$BACKUP/mu/$file" "$LIVE_MU/$file"' /tmp/remote-deploy.sh
          echo 'MU_CONTENT_COPY_GUARD_OK'
      - name: Reproduce archive extraction and shell normalization
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wh-release-ci /tmp/wh-release-ci.tar
          mkdir -p /tmp/wh-release-ci
          git archive --format=tar --output=/tmp/wh-release-ci.tar HEAD
          tar -tf /tmp/wh-release-ci.tar > /tmp/wh-release-ci.list
          grep -Fxq 'scripts/n8n-supplier-catalog-sync.sh' /tmp/wh-release-ci.list
          grep -Fxq 'scripts/supplier-catalog-watchdog.sh' /tmp/wh-release-ci.list
          grep -Fxq 'scripts/supplier-catalog/collect-dailyfood-catalog.mjs' /tmp/wh-release-ci.list
          grep -q '^wordpress/plugins/avocadoss-performance/' /tmp/wh-release-ci.list
          tar -xf /tmp/wh-release-ci.tar -C /tmp/wh-release-ci
          find /tmp/wh-release-ci -type f -name '*.sh' -exec sed -i 's/\r$//' {} +
          ! LC_ALL=C grep -q $'\r' /tmp/wh-release-ci/scripts/n8n-supplier-catalog-sync.sh
          bash -n /tmp/wh-release-ci/scripts/n8n-supplier-catalog-sync.sh
          bash -n /tmp/wh-release-ci/scripts/supplier-catalog-watchdog.sh
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/collect-dailyfood-catalog.mjs
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/collect-walldob2b-catalog.mjs
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/build-catalog-plan.mjs
          echo 'RELEASE_STAGE_PREFLIGHT_OK'
