name: deploy-wrapper-ci

on:
  pull_request:
    paths:
      - 'scripts/deploy-wholesalehub.ps1'
      - '.github/workflows/deploy-wrapper-ci.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/deploy-wholesalehub.ps1'
      - '.github/workflows/deploy-wrapper-ci.yml'

jobs:
  powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell wrapper
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\scripts\deploy-wholesalehub.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("PARSE_ERROR line={0} col={1} message={2} text={3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
            }
            exit 1
          }
          Write-Host 'POWERSHELL_PARSE_OK'
      - name: Verify Windows CRLF is normalized before remote Bash upload
        shell: powershell
        run: |
          $text = Get-Content '.\scripts\deploy-wholesalehub.ps1' -Raw
          if ($text -notmatch '\$remoteScript\s*=\s*\$remoteScript\.Replace\("`r`n",\s*"`n"\)\.Replace\("`r",\s*"`n"\)') {
            throw 'Required CRLF-to-LF normalization is missing from deploy wrapper.'
          }
          $sample = "#!/usr/bin/env bash`r`nset -Eeuo pipefail`r`necho ok`r`n"
          $sample = $sample.Replace("`r`n", "`n").Replace("`r", "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($sample)
          if ($bytes -contains 13) { throw 'CR byte remains after normalization.' }
          Write-Host 'WINDOWS_TO_UNIX_LF_OK'

  embedded-bash-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract embedded remote Bash
        shell: pwsh
        run: |
          $text = Get-Content './scripts/deploy-wholesalehub.ps1' -Raw
          $startMarker = '$remoteScript = @'''
          $start = $text.IndexOf($startMarker)
          if ($start -lt 0) { throw 'Embedded remote Bash start marker not found' }
          $bodyStart = $text.IndexOf("`n", $start) + 1
          $end = $text.IndexOf("`n'@", $bodyStart)
          if ($bodyStart -le 0 -or $end -lt 0) { throw 'Embedded remote Bash end marker not found' }
          $bash = $text.Substring($bodyStart, $end - $bodyStart)
          $bash = $bash.Replace("`r`n", "`n").Replace("`r", "`n")
          [System.IO.File]::WriteAllText('/tmp/remote-deploy.sh', $bash, [System.Text.UTF8Encoding]::new($false))
      - name: Assert LF-only embedded Bash
        shell: bash
        run: |
          set -euo pipefail
          if LC_ALL=C grep -q $'\r' /tmp/remote-deploy.sh; then
            echo 'CR byte found in generated Bash' >&2
            exit 1
          fi
      - name: Parse embedded remote Bash
        shell: bash
        run: |
          set -euo pipefail
          bash -n /tmp/remote-deploy.sh
          echo 'REMOTE_BASH_PARSE_OK'
      - name: Reproduce release archive staging and preflight
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wh-release-ci /tmp/wh-release-ci.tar
          mkdir -p /tmp/wh-release-ci
          git archive --format=tar --output=/tmp/wh-release-ci.tar HEAD
          tar -tf /tmp/wh-release-ci.tar > /tmp/wh-release-ci.list
          grep -Fxq 'scripts/n8n-supplier-catalog-sync.sh' /tmp/wh-release-ci.list
          grep -Fxq 'scripts/supplier-catalog/collect-dailyfood-catalog.mjs' /tmp/wh-release-ci.list
          grep -q '^wordpress/plugins/avocadoss-performance/' /tmp/wh-release-ci.list
          tar -xf /tmp/wh-release-ci.tar -C /tmp/wh-release-ci
          test -f /tmp/wh-release-ci/scripts/n8n-supplier-catalog-sync.sh
          test -f /tmp/wh-release-ci/scripts/supplier-catalog/collect-dailyfood-catalog.mjs
          test -f /tmp/wh-release-ci/scripts/supplier-catalog/collect-walldob2b-catalog.mjs
          test -f /tmp/wh-release-ci/scripts/supplier-catalog/build-catalog-plan.mjs
          bash -n /tmp/wh-release-ci/scripts/n8n-supplier-catalog-sync.sh
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/collect-dailyfood-catalog.mjs
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/collect-walldob2b-catalog.mjs
          node --check /tmp/wh-release-ci/scripts/supplier-catalog/build-catalog-plan.mjs
          echo 'RELEASE_STAGE_PREFLIGHT_OK'
