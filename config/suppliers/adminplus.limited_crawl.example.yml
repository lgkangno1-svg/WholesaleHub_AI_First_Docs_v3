supplier_id: adminplus_supplier_example
supplier_name: AdminPlus 공급처 예시
source_type: adminplus_limited
enabled: false

risk_policy:
  requires_manual_approval: true
  note: "AdminPlus 계열은 약관 리스크가 있으므로 가격 수집만 오전 11시 1회로 제한한다."

schedule:
  timezone: Asia/Seoul
  cron: "0 11 * * *"
  max_runs_per_day: 1

collection:
  price_crawling_enabled: true
  auto_order_enabled: false
  playwright_enabled: true
  collect_only:
    - product_name
    - option_text
    - price
    - stock_status
    - product_url
  blocked:
    - hidden_api_reverse_engineering
    - token_analysis
    - captcha_bypass
    - auto_order_macro
    - cart_automation
    - payment_automation
    - detail_description_copy
    - image_download
    - review_collection

rate_limit:
  concurrency: 1
  min_delay_ms: 3000
  max_delay_ms: 8000
  timeout_ms: 30000
  retry_count: 1
